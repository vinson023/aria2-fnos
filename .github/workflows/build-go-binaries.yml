# Cross-compile Go binaries (aria2-manager and aria2-hook) for both x86_64 and aarch64.
# Go produces static binaries when CGO_ENABLED=0, so no C toolchain is needed.
name: Build Go Binaries

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (amd64 or arm64 or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - amd64
          - arm64

permissions:
  contents: read

jobs:
  build:
    name: Build Go binaries (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        if: github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.goarch
        uses: actions/checkout@v4

      - name: Set up Go
        if: github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.goarch
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum

      - name: Build aria2-manager
        if: github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.goarch
        working-directory: manager
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -o /tmp/aria2-manager-${{ matrix.goarch }} ./cmd/aria2-manager/
          go build -trimpath -o /tmp/aria2-hook-${{ matrix.goarch }} ./cmd/aria2-hook/

      - name: Verify ELF architecture
        if: github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.goarch
        run: |
          echo "=== aria2-manager ==="
          file /tmp/aria2-manager-${{ matrix.goarch }}
          sha256sum /tmp/aria2-manager-${{ matrix.goarch }}

          echo "=== aria2-hook ==="
          file /tmp/aria2-hook-${{ matrix.goarch }}
          sha256sum /tmp/aria2-hook-${{ matrix.goarch }}

      - name: Upload artifacts
        if: github.event.inputs.arch == 'both' || github.event.inputs.arch == matrix.goarch
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries-${{ matrix.goarch }}
          path: |
            /tmp/aria2-manager-${{ matrix.goarch }}
            /tmp/aria2-hook-${{ matrix.goarch }}
